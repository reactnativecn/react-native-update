name: test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js-test:
    name: JS Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        id: setup-bun

      - name: Restore installed dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'scripts/check-expo-version.js') }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun test src/__tests__

  cpp-test:
    name: C++ Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install missing build dependencies
        shell: bash
        run: |
          missing=()
          for package in zlib1g-dev libbz2-dev; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$package")
            fi
          done

          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          else
            echo "Build dependencies are already installed."
          fi

      - name: Build HDiffPatch library
        working-directory: android/jni/HDiffPatch
        run: make LZMA=0 DIR_DIFF=0

      - name: Build and run unit_test
        working-directory: android/jni/HDiffPatch
        run: |
          g++ -O2 test/unit_test.cpp libhdiffpatch.a \
            -D_IS_NEED_ALL_CompressPlugin=0 \
            -D_IS_NEED_DEFAULT_CompressPlugin=0 \
            -D_IS_NEED_DIR_DIFF_PATCH=0 \
            -lpthread \
            -o unit_test
          ./unit_test

      # Golden-vector parity between src/updateFlowCore.ts (reference) and
      # the cpp/update_flow_core port. The vectors themselves are kept in
      # sync with the TS side by src/__tests__/flowVectors.test.ts (js-test).
      - name: Replay flow golden vectors against the C++ port
        run: SANITIZE=1 ./scripts/test-update-flow-core.sh
