name: Publish Package to npmjs
on:
  release:
    types: [published]
  # One-time maintainer-authorized release request; removed after verification.
  push:
    branches: [master]
    paths: [.github/releases/v10.57.0.md]

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || 'v10.57.0' }}

concurrency:
  group: npm-release-${{ github.event.release.tag_name || 'v10.57.0' }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  check_changes:
    runs-on: ubuntu-latest  # npm --provenance requires a GitHub-hosted runner
    outputs:
      harmony_changed: ${{ steps.check.outputs.changed }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify version before building
        run: node scripts/check-release-version.js
      - name: Check Harmony changes
        id: check
        shell: bash
        run: |
          # The baseline has to be the newest ancestor tag that actually made it
          # to npm, not merely the newest tag: a tag whose publish run failed
          # (v10.52.2 died in prepack) exists in git but not on the registry, and
          # "Fetch previous Harmony HAR" pulls that version's tarball from npm.
          # Picking it would fail the whole publish on ETARGET.
          PREV_TAG=""
          for tag in $(git tag --sort=-v:refname --merged HEAD^ | head -20); do
            case "$tag" in v[0-9]*) ;; *) continue ;; esac
            if npm view "react-native-update@${tag#v}" version >/dev/null 2>&1; then
              PREV_TAG="$tag"
              break
            fi
            echo "Skipping $tag: tagged but never published to npm."
          done
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          if [ -z "$PREV_TAG" ]; then
            echo "No previous published tag found, assuming harmony changed."
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Previous tag is $PREV_TAG"
          # The HAR embeds librnupdate.so compiled from cpp/patch_core,
          # cpp/update_flow_core, android/jni/hpatch.c and the HDiffPatch/lzma
          # submodules (harmony/pushy/src/main/cpp/CMakeLists.txt), so any of
          # those changing must rebuild it too — reusing the previous HAR
          # would ship Harmony with an older native core than Android/iOS.
          if git diff --name-only "$PREV_TAG" HEAD \
              | grep -qE '^(harmony|cpp|android/jni)/|^scripts/build-harmony-har\.js$|^\.gitmodules$'; then
            echo "harmony HAR inputs changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "harmony HAR inputs have NO changes."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  # Rebuild the Android native libraries from source so the published package
  # can never ship a stale librnupdate.so after a cpp/patch_core change (the
  # committed binaries are for local dev / git installs only).
  build_android_so:
    runs-on: ubuntu-latest  # npm --provenance requires a GitHub-hosted runner
    timeout-minutes: 15
    env:
      # Keep in sync with PINNED_NDK_VERSION in scripts/build-android-so.sh.
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pinned NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
      - name: Build and verify native libraries
        # The runner image presets ANDROID_NDK_HOME/ANDROID_NDK_ROOT to its
        # bundled NDK, which would win over the pinned install in the script's
        # resolution order — force the pinned one so published .so files don't
        # drift with runner image upgrades.
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash scripts/build-android-so.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-so
          path: android/lib/
          if-no-files-found: error

  publish_with_harmony:
    needs: [check_changes, build_android_so]
    if: needs.check_changes.outputs.harmony_changed == 'true'
    runs-on: ubuntu-latest  # npm --provenance requires a GitHub-hosted runner
    # Pinned by digest (manifest list of :latest as of 2026-08-30); bump deliberately.
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest@sha256:2836142b7b6ae8837ad0e36cacc650f00e8c88f55b4e9f34be66cc98a731c5da
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$toplevel/$sm_path"'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      # Drop the committed binaries first: the artifact must fully replace
      # android/lib, so any layout regression makes the verify step fail loudly
      # instead of silently passing against stale committed .so files.
      - name: Remove committed Android native libraries
        run: rm -rf android/lib
      - name: Use CI-built Android native libraries
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: android/lib
      - name: Verify Android native libraries
        run: node scripts/verify-android-so.js
      - name: Build Harmony HAR
        run: npm run build:harmony-har -- --build-mode release
      - name: Verify Harmony HAR artifact
        run: test -f harmony/pushy.har
      - name: Verify release tag matches package version
        run: node scripts/check-release-version.js
      - name: Verify publish file list
        run: node scripts/check-packlist.js --release
      - name: Publish to npm
        shell: bash
        run: |
          if [[ "${{ github.event.release.tag_name }}" == *"beta"* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  publish_without_harmony:
    needs: [check_changes, build_android_so]
    if: needs.check_changes.outputs.harmony_changed == 'false'
    runs-on: ubuntu-latest  # npm --provenance requires a GitHub-hosted runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$toplevel/$sm_path"'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      # Drop the committed binaries first: the artifact must fully replace
      # android/lib, so any layout regression makes the verify step fail loudly
      # instead of silently passing against stale committed .so files.
      - name: Remove committed Android native libraries
        run: rm -rf android/lib
      - name: Use CI-built Android native libraries
        uses: actions/download-artifact@v8
        with:
          name: android-so
          path: android/lib
      - name: Verify Android native libraries
        run: node scripts/verify-android-so.js
      # Fail closed: the package must always ship harmony/pushy.har
      # (.npmignore explicitly whitelists it). If the previous release can't
      # be fetched, fix the cause or re-run — never publish a HAR-less package.
      - name: Fetch previous Harmony HAR
        shell: bash
        run: |
          PREV_VERSION="${{ needs.check_changes.outputs.prev_tag }}"
          PREV_VERSION="${PREV_VERSION#v}"
          echo "Fetching harmony/pushy.har from react-native-update@$PREV_VERSION"
          npm pack "react-native-update@$PREV_VERSION"
          tar -xzf "react-native-update-${PREV_VERSION}.tgz" package/harmony/pushy.har
          mkdir -p harmony
          cp package/harmony/pushy.har harmony/pushy.har
          # Clean up temporary pack and extraction files to prevent publishing them
          rm -rf "react-native-update-${PREV_VERSION}.tgz" package
      - name: Verify Harmony HAR artifact
        run: test -f harmony/pushy.har
      - name: Verify release tag matches package version
        run: node scripts/check-release-version.js
      - name: Verify publish file list
        run: node scripts/check-packlist.js --release
      - name: Publish to npm
        shell: bash
        run: |
          if [[ "${{ github.event.release.tag_name }}" == *"beta"* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  # Finalize only this explicitly requested release, after registry publication.
  finalize_v10570:
    needs: [publish_with_harmony, publish_without_harmony]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      (needs.publish_with_harmony.result == 'success' || needs.publish_without_harmony.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the published registry package
        shell: bash
        run: |
          test "$(npm view react-native-update@10.57.0 version)" = '10.57.0'
          test "$(npm view react-native-update dist-tags.latest)" = '10.57.0'
          mkdir -p "$RUNNER_TEMP/pushy-10.57.0"
          cd "$RUNNER_TEMP/pushy-10.57.0"
          npm pack react-native-update@10.57.0 --ignore-scripts
          tar -xzf react-native-update-10.57.0.tgz
          test -s package/harmony/pushy.har
          grep -q 'configure' package/android/src/main/java/cn/reactnative/modules/update/PushyNativeUpdate.java
          grep -q 'configure:' package/ios/RCTPushy/RCTPushy.h
          grep -q 'nativeConfigSource' package/src/type.ts
          echo 'Registry latest=10.57.0; native APIs and Harmony HAR verified.'
      - name: Create the bilingual GitHub Release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const tag = 'v10.57.0';
            if (require('./package.json').version !== '10.57.0') throw new Error('Version drift');
            const body = fs.readFileSync('.github/releases/v10.57.0.md', 'utf8');
            if (!body.includes('## English') || !body.includes('## 中文')) throw new Error('Missing bilingual release notes');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              if (release.body !== body || release.draft || release.prerelease) throw new Error('Existing release differs; refusing overwrite');
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: tag, body, draft: false, prerelease: false, make_latest: 'true'
              })).data;
            }
            const verified = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            if (verified.body !== body || verified.draft || verified.prerelease) throw new Error('Release verification failed');
            core.info(verified.html_url);
            await core.summary.addHeading('v10.57.0 published').addRaw('npm latest and native package contents verified.\n').addLink('GitHub Release', verified.html_url).write();
