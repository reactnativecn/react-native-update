name: Prepare native host API
on:
  push:
    branches: [feat/native-host-update-api]
    paths: [.github/workflows/native-host-api-prepare.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply source edits
        run: |
          python3 scripts/add-native-host-api.py
          git diff --check
          git diff --stat
      - name: Commit only the native API implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/src/main/java/cn/reactnative/modules/update/NativeCheckOrchestrator.java ios/RCTPushy/RCTPushy.mm harmony/pushy/src/main/ets/NativeCheckOrchestrator.ts harmony/pushy/src/main/ets/PushyFileJSBundleProvider.ets harmony/pushy/index.ets
          git commit -m 'feat: connect native host APIs to the shared update round'
          git push origin HEAD:refs/heads/feat/native-host-update-api
