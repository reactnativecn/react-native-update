name: lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        id: setup-bun

      - name: Restore installed dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'scripts/check-expo-version.js') }}

      - name: Install Dependency
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun lint
