name: Prepare native configuration
on:
  push:
    branches: [feat/native-host-update-api]
    paths: [.github/workflows/native-configuration-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply guarded source changes
        run: python3 scripts/prepare-native-configuration.py
      - name: Check JS types and tests
        run: |
          bun install --frozen-lockfile
          bunx biome check --write src
          bunx tsc --noEmit
          bun test src/__tests__
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/src/main/java/cn/reactnative/modules/update/{PushyNativeUpdate,UpdateContext,UpdateModuleImpl,NativeCheckOrchestrator}.java ios/RCTPushy/RCTPushy.{h,mm} harmony/pushy/src/main/ets/{UpdateContext,PushyTurboModule,NativeCheckOrchestrator}.ts harmony/pushy/src/main/ets/PushyFileJSBundleProvider.ets harmony/pushy/index.ets src/client.ts src/type.ts src/NativePushy.ts
          git commit -m 'feat: configure native updates before JS with explicit configuration ownership'
          git push origin HEAD:refs/heads/feat/native-host-update-api
