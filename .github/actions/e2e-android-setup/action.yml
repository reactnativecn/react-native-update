name: E2E Android setup
description: >-
  Shared setup for the Android Detox jobs: Java (+ Gradle cache) and KVM, then
  the platform-neutral e2e setup (../e2e-common: toolchains, Bun cache, the
  e2e project's dependencies and the local react-native-update link). Runs
  after the react-native-update checkout (this action lives in it).
inputs:
  project-dir:
    description: E2E app directory, relative to the workspace.
    default: Example/e2etest
  checkout-cli:
    description: Check out and build react-native-update-cli (needed to prepare update artifacts).
    default: 'true'
  bun-cache-scope:
    description: Extra bun cache key segment for jobs whose dependency set differs.
    default: ''
  bun-cache-key-suffix:
    description: Extra hash appended to the bun cache key.
    default: ''
  gradle-cache-dependency-path:
    description: Files whose hash keys the Gradle cache; they must exist before the e2e project is created.
    default: |
      Example/e2etest/bun.lock
      Example/e2etest/android/*.gradle
      Example/e2etest/android/**/*.gradle
      Example/e2etest/android/gradle/wrapper/gradle-wrapper.properties
  create-project:
    description: Command that generates the e2e project before its dependencies are installed.
    default: ''
  frozen-lockfile:
    description: Install with --frozen-lockfile (false only for generated projects that have no lockfile).
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: ${{ inputs.gradle-cache-dependency-path }}

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Common e2e setup
      uses: ./.github/actions/e2e-common
      with:
        project-dir: ${{ inputs.project-dir }}
        checkout-cli: ${{ inputs.checkout-cli }}
        bun-cache-scope: ${{ inputs.bun-cache-scope }}
        bun-cache-key-suffix: ${{ inputs.bun-cache-key-suffix }}
        create-project: ${{ inputs.create-project }}
        frozen-lockfile: ${{ inputs.frozen-lockfile }}
